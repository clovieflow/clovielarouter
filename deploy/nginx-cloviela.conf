# HTTP — redirect + ACME challenge
server {
    listen 80;
    listen [::]:80;
    server_name router.cloviela.my.id;
    client_max_body_size 100m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# HTTPS — sertifikat self-signed origin (Cloudflare Full mode)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name router.cloviela.my.id;

    ssl_certificate /etc/ssl/cloviela/origin.crt;
    ssl_certificate_key /etc/ssl/cloviela/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 100m;

    location = /api/webhook/paymenku {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 60s;
    }
    location /v1/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
